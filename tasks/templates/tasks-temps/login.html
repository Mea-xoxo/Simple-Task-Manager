
{% extends 'tasks-temps/base.html' %}
{% load static %}

{% block content %}
<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand"> Task Manager</div>

        <div class="auth-heading">
            <h1>Hello Welcome</h1>
            <p>A little progress each day adds up.</p>
        </div>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <label for="username">Username</label>
            <div class="auth-input-wrap">
                <span></span>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <label for="password">Password</label>
            <div class="auth-input-wrap">
                <span></span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-submit">
                Log in
            </button>
        </form>

        <p class="auth-footer">
            New here?
            <a href="{% url 'register' %}">Create an account</a>
        </p>

    </div>

    
</div>
{% endblock %}
